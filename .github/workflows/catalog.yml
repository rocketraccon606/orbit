name: catalog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "curator/**"
      - ".github/workflows/catalog.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catalog-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: pip install pytest

      - name: Curator tests
        run: python -m pytest curator/tests -q

      - name: Fetch previous health state and report
        env:
          BASE: ${{ vars.CATALOG_BASE_URL }}
        run: |
          BASE="${BASE:-https://rocketraccon606.github.io/orbit}"
          mkdir -p curator/.state curator/prev
          curl -fsSL "$BASE/report.json" -o curator/prev/report.json || true
          curl -fsSL "$BASE/state/health.json" -o curator/.state/health.json || true
          echo "previous report: $(test -s curator/prev/report.json && echo yes || echo no)"
          echo "previous health: $(test -s curator/.state/health.json && echo yes || echo no)"

      - name: Build catalog
        env:
          PYTHONPATH: curator
        run: |
          ARGS="--out curator/dist --history curator/.state/health.json --workers 24 --timeout 8"
          if [ -s curator/prev/report.json ]; then
            ARGS="$ARGS --previous-report curator/prev/report.json"
          fi
          python -m orbit_curator build $ARGS

      - name: Validate catalog
        env:
          PYTHONPATH: curator
        run: |
          python -m orbit_curator validate \
            --catalog curator/dist/catalog.db \
            --report curator/dist/report.json

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-report
          path: |
            curator/dist/report.json
            curator/dist/version.json
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: curator/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
